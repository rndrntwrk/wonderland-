[package]
name = "swarm-a-replay"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MPL-2.0"
description = "Native/browser-WASM deterministic simulation replay acceptance harness"

[lib]
name = "swarm_a_replay"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "sim-replay"
path = "src/main.rs"

[dependencies]
sim-core = { path = "../../../crates/sim-core" }
serde = { version = "=1.0.195", features = ["derive"] }
bincode = "=1.3.3"
sha2 = "=0.10.8"

[profile.release]
overflow-checks = true
panic = "abort"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
