[package]
name = "wonderland-creator-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MPL-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wonderland-creator = { path = "../creator" }
wonderland-legacy-formats = { path = "../../crates/legacy-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "KeyboardEvent", "Event", "BeforeUnloadEvent"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
debug = 0
strip = "debuginfo"
lto = "thin"
panic = "abort"
codegen-units = 1
