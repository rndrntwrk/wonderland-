[package]
name = "wonderland-asset-cooker"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MPL-2.0"
publish = false

[[bin]]
name = "wonderland-asset-cooker"
path = "src/main.rs"

[dependencies]
wonderland-legacy-formats = { path = "../../crates/legacy-formats" }
wonderland-content-ir = { path = "../../crates/content-ir" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
