name: Native terrain source transfer
on:
  push:
    branches: [feat/native-terrain-contact]
    paths: [tools/native-browser/terrain-delivery.json]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate pinned source and bounded patch without running product code
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          p=pathlib.Path('tools/native-browser/terrain-delivery.json')
          assert p.is_file() and p.stat().st_size<100000
          doc=json.loads(p.read_text())
          base='13580dd2d0e2fefbefb73e4d0011032f80c06fb0'
          assert doc['base']==base
          allowed={'.github/workflows/native-browser.yml','apps/web-shell/src/native_avatar.rs','apps/web-shell/src/native_lot.rs','apps/web-shell/tests/native_avatar.rs','crates/game-runtime/examples/native_browser_peer.rs','crates/game-runtime/src/world_projection.rs','crates/game-runtime/tests/native_ground_contact.rs','docs/design/action-first/native-terrain-contact-verification.json','docs/design/action-first/native-terrain-contact.md','tools/native-browser/peer.mjs','tools/native-browser/verify-avatars.mjs'}
          assert set(doc['paths'])==allowed
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(base64.b64decode(doc['patch_xz_base64'],validate=True),max_length=500001)
          assert decoder.eof and not decoder.unused_data and len(patch)<=500000
          assert hashlib.sha256(patch).hexdigest()==doc['sha256']
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==doc['tree']
          files=[]
          for path in sorted(allowed):
              indexed=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).strip()
              mode,sha,stage=indexed.split('\t')[0].split()
              assert mode=='100644' and stage=='0'
              data=subprocess.check_output(['git','show',':'+path]);assert len(data)<150000
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              files.append({'path':path,'mode':mode,'type':'blob','sha':sha,'content':base64.b64encode(data).decode()})
          pathlib.Path('terrain-files.json').write_text(json.dumps({'base':base,'tree':tree,'patch_sha256':doc['sha256'],'files':files}))
          print('Exact locally tested source tree:',tree)
          PY
      - name: Store checked public source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          doc=json.loads(pathlib.Path('terrain-files.json').read_text())
          for f in doc['files']:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':f.pop('content')}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:assert json.load(r)['sha']==f['sha']
          doc['branch_updated']=False
          doc['test_execution_in_this_transfer']=False
          pathlib.Path('native-terrain-tree.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-terrain-tree
          path: native-terrain-tree.json
          retention-days: 3
          if-no-files-found: error
