name: Player integration source transfer
on:
  push:
    branches: [feat/connected-player-integration]
    paths: [tools/native-browser/integration-delivery.json, .github/workflows/player-integration-inputs.yml]
permissions:
  contents: read
jobs:
  blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate exact pinned composition without executing application code
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          p=pathlib.Path('tools/native-browser/integration-delivery.json')
          assert p.is_file() and p.stat().st_size<100000
          doc=json.loads(p.read_text())
          base='8b2d6a7197b8b57fa59060f89e3c740b95a540ab'
          pose='015f00e0955a791286f0013868fa0ab399821686'
          assert doc['schema']==1 and doc['base']==base and doc['pose']==pose
          allowed={'.github/workflows/native-browser.yml','.github/workflows/native-pose-retention.yml','apps/web-shell/examples/native_pose_retention_probe.rs','apps/web-shell/scripts/verify-native-pose-retention.mjs','apps/web-shell/src/native_audio_browser.rs','apps/web-shell/src/native_avatar.rs','apps/web-shell/src/native_avatar/history.rs','apps/web-shell/src/native_lot.rs','apps/web-shell/tests/native_avatar_retention.rs','crates/game-runtime/examples/native_browser_peer.rs','crates/game-runtime/src/avatar_projection.rs','crates/game-runtime/src/live_session.rs','crates/game-runtime/src/live_wire.rs','crates/game-runtime/src/live_wire/player.rs','crates/game-runtime/tests/avatar_replay.rs','crates/game-runtime/tests/native_player.rs','docs/design/action-first/native-avatar-pose-retention.md','docs/design/action-first/native-pose-replay-publication.md','docs/design/action-first/connected-player-integration.md','docs/design/action-first/connected-player-integration-verification.json','tools/native-browser/peer.mjs','tools/native-browser/verify-audio.mjs','tools/native-browser/verify-avatars.mjs','tools/native-browser/verify-pose-batches.mjs','tools/native-browser/verify-pose-retention.mjs'}
          assert set(doc['paths'])==allowed and len(doc['copy_from_pose'])==15
          assert set(doc['copy_from_pose'])<=allowed
          # Repair the single known transcription insertion, not product source.
          # The independently recorded patch checksum and final tree remain exact.
          encoded=doc['patch_xz_base64']
          assert encoded.count('ZR+j+leLJJhx3')==1
          encoded=encoded.replace('ZR+j+leLJJhx3','ZR+j+leLJhx3',1)
          assert len(encoded)==29080
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=dec.decompress(base64.b64decode(encoded,validate=True),max_length=500001)
          assert dec.eof and not dec.unused_data and len(patch)<=500000
          assert hashlib.sha256(patch).hexdigest()==doc['patch_sha256']=='6bac16fda5b6abf2f6b92b97e78ce3a060237d9310ad6be3d31b301875017fac'
          subprocess.run(['git','fetch','--depth=1','origin',base,pose],check=True)
          subprocess.run(['git','checkout','--detach',base],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='dd4aeee0124b7ff0451cfb7ac0bdfc9f35f66785'
          for path,sha in doc['copy_from_pose'].items():
              data=subprocess.check_output(['git','show',pose+':'+path])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              target=pathlib.Path(path);assert not target.is_symlink()
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          subprocess.run(['git','add','--',*doc['copy_from_pose']],check=True)
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==doc['tree']=='5d67dc06605383a8ec96afa7c1606c6b53b4382b'
          entries=[]
          for path in sorted(allowed):
              row=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).strip()
              mode,sha,stage=row.split('\t')[0].split();assert mode=='100644' and stage=='0'
              data=subprocess.check_output(['git','show',':'+path]);assert len(data)<200000
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha,'content':base64.b64encode(data).decode()})
          pathlib.Path('integration-files.json').write_text(json.dumps({'base':base,'pose':pose,'tree':tree,'patch_sha256':doc['patch_sha256'],'files':entries}))
          print('Exact locally verified tree:',tree)
          PY
      - name: Store checked public source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          doc=json.loads(pathlib.Path('integration-files.json').read_text())
          for f in doc['files']:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':f.pop('content')}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:assert json.load(r)['sha']==f['sha']
          doc['branch_updated']=False
          doc['tests_executed_by_transfer']=False
          pathlib.Path('player-integration-tree.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: player-integration-tree
          path: player-integration-tree.json
          retention-days: 3
          if-no-files-found: error
