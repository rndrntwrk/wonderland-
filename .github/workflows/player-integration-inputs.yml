name: Player integration inputs
on:
  push:
    branches: [feat/connected-player-integration]
    paths: [.github/workflows/player-integration-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Export pinned every-tick pose source and commit identities
        run: |
          set -euo pipefail
          base=13580dd2d0e2fefbefb73e4d0011032f80c06fb0
          pose=015f00e0955a791286f0013868fa0ab399821686
          audio=8b2d6a7197b8b57fa59060f89e3c740b95a540ab
          git fetch --depth=1 origin "$base" "$pose" "$audio"
          mkdir -p /tmp/player-integration-inputs
          git diff --binary "$base" "$pose" > /tmp/player-integration-inputs/pose.patch
          git ls-tree -rz "$pose" > /tmp/player-integration-inputs/pose-tree.bin
          for ref in "$base" "$pose" "$audio" "$GITHUB_SHA"; do
            git cat-file commit "$ref" > "/tmp/player-integration-inputs/$ref.commit"
          done
          sha256sum /tmp/player-integration-inputs/* > /tmp/player-integration-inputs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: player-integration-inputs
          path: /tmp/player-integration-inputs/
          retention-days: 3
          if-no-files-found: error
