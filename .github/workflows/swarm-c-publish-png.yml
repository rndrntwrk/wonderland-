name: Swarm C guarded PNG implementation
on:
  push:
    branches: [feat/swarm-c-client-integration]
    paths: [.github/workflows/swarm-c-publish-png.yml]
permissions:
  contents: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Admit only the exact locally tested patch against unchanged source
        run: |
          set -euo pipefail
          mkdir -p tests/output/png-handoff
          cp tools/swarm-c/client-png.patch.zlib.b64 tests/output/png-handoff/transport.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,zlib,subprocess
          before={'.github/workflows/browser-ui.yml':'45b46e4193ab44e2c36bc1ba40fff85cfb8f21f50f117a0e23e9d2e48a182d3a','.github/workflows/swarm-c-client.yml':'6a6d0872027467d7b792019a31ef7a9d298f438de741239af34266dd29a0d8d5','apps/web-shell/public/world-capture.mjs':None,'apps/web-shell/public/world-gpu.mjs':'2f71c618107833f7aaebabba06e3b131fd73a84745ed532e5bb55be8a82e3971','apps/web-shell/public/world.css':'f521699c3e4d7506f996c0926646b738aae81eb7066d10600980d219e589345f','apps/web-shell/src/lib.rs':'c703be32d3a136a557d0c69f77ead7dc75151b1ea1e493d8a94a3afd138f1bdb','apps/web-shell/src/source_world_screen.rs':'d8eb926c9be09d5d1cd0bedcb316948f0416c5c3381f17ac67e0d6bf4cca3fdb','apps/web-shell/src/world_capture.rs':None,'apps/web-shell/src/world_renderer.rs':'e5a08c0c9a0c625e630e6b3f746b600f9d10fe45ef969a2a55835f958f179864','apps/web-shell/tests/gpu/application.mjs':'cbf14019121c815c43a2b015f240dec2b8fd86ff2770156f29c120fb9e4d8e7d','apps/web-shell/tests/gpu/browser.mjs':'217d4321ae80461282ba2b335d73d65de1b94cee0ce0ae6d105929d8db86ed3e','apps/web-shell/tests/gpu/capture.test.mjs':None,'apps/web-shell/tests/gpu/png.mjs':None}
          for name,digest in before.items():
              p=Path(name)
              assert (not p.exists()) if digest is None else hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
          transport=Path('tools/swarm-c/client-png.patch.zlib.b64').read_text().strip()
          # Correct four known transcription errors in the transport only.
          # The complete decoded patch must still equal the local SHA256 below.
          for old,new in [('lPYfHTRj0','lPYfHRj0'),('06wZ30TQ+xHl0','06wZ30T+xHl0'),('UIq5n5bfN8Eku7','UIq5n5XN8Eku7'),('WXs7xuRcWW60','WXs7xuRcW60')]:
              assert transport.count(old)==1,old
              transport=transport.replace(old,new)
          patch=zlib.decompress(base64.b64decode(transport,validate=True))
          assert len(patch)==45665 and hashlib.sha256(patch).hexdigest()=='67f7b9f99e4b595d86a6f8b5693dcbf0cff519ce7f579a752fad94162c6dacdf','patch transport identity mismatch'
          Path('/tmp/client-png.patch').write_bytes(patch)
          Path('tests/output/png-handoff/allowlist.json').write_text(json.dumps([n for n in before if n.startswith('apps/')]))
          subprocess.run(['git','apply','--check','--unidiff-zero','--exclude=.github/workflows/*','/tmp/client-png.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--exclude=.github/workflows/*','/tmp/client-png.patch'],check=True)
          PY
          node --test apps/web-shell/tests/gpu/*.test.mjs crates/audio-runtime/browser/*.test.mjs | tee tests/output/png-handoff/node.log
          node --check apps/web-shell/tests/gpu/application.mjs
          node --check apps/web-shell/tests/gpu/browser.mjs
          git diff --check
      - name: Install existing pinned compiler and format only the admitted source
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo fmt --all
          git diff --check
      - name: Native capture and source rendering plus strict WASM verification
        run: |
          set -euo pipefail
          cargo test -p wonderland-web-shell world_capture --locked 2>&1 | tee tests/output/png-handoff/native-capture.log
          cargo test -p wonderland-world-view --locked 2>&1 | tee tests/output/png-handoff/native-world.log
          cargo run -p wonderland-world-view --example gpu_fixture --locked -- tests/output/source-gpu
          cargo clippy -p wonderland-web-shell --target wasm32-unknown-unknown --lib --bin wonderland-web-shell --locked -- -D warnings 2>&1 | tee tests/output/png-handoff/wasm-clippy.log
      - name: Exercise actual GPU colors, PNG decoding and capture lifecycle
        run: |
          set -euo pipefail
          npm install --prefix /tmp/png-playwright --ignore-scripts --no-audit --no-fund playwright@1.62.1
          /tmp/png-playwright/node_modules/.bin/playwright install --with-deps --no-shell chromium
          WONDERLAND_PLAYWRIGHT_MODULE=/tmp/png-playwright/node_modules/playwright/index.mjs node apps/web-shell/tests/gpu/browser.mjs 2>&1 | tee tests/output/png-handoff/gpu.log
      - name: Publish only admitted application paths with an unchanged branch lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/swarm-c-client-integration
          test "$(gh api repos/rndrntwrk/wonderland-/git/ref/heads/feat/swarm-c-client-integration --jq .object.sha)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          allowed=set(json.loads(Path('tests/output/png-handoff/allowlist.json').read_text()))
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          new=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert modified<=allowed,modified-allowed
          assert allowed <= (modified|new),allowed-(modified|new)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          PY
          git diff --cached --binary > tests/output/png-handoff/implementation.patch
          git config user.name 'Wonderland verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(swarm-c): source-view PNG exports with generation-safe capture lifetime'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/swarm-c-client-integration
          git rev-parse HEAD > tests/output/png-handoff/tested-commit.txt
          git rev-parse HEAD^{tree} > tests/output/png-handoff/tested-tree.txt
      - name: Build the actual release application and exercise visible capture controls
        run: |
          set -euo pipefail
          cargo install trunk --version 0.21.14 --locked
          (cd apps/web-shell && trunk build --release --locked) 2>&1 | tee tests/output/png-handoff/build.log
          WONDERLAND_PLAYWRIGHT_MODULE=/tmp/png-playwright/node_modules/playwright/index.mjs node apps/web-shell/tests/gpu/application.mjs 2>&1 | tee tests/output/png-handoff/application.log
      - name: Retain exact candidate code and observations even on failure
        if: always()
        run: |
          mkdir -p tests/output/png-handoff
          git diff --binary > tests/output/png-handoff/unstaged.patch
          git diff --cached --binary > tests/output/png-handoff/staged.patch
          tar -czf tests/output/png-handoff/candidate-source.tar.gz apps/web-shell/src apps/web-shell/public apps/web-shell/tests/gpu
          sha256sum tests/output/png-handoff/candidate-source.tar.gz > tests/output/png-handoff/candidate-source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: png-handoff-${{ github.sha }}
          path: |
            tests/output/png-handoff/
            tests/output/source-gpu/
            tests/output/source-application/
          retention-days: 14
          if-no-files-found: error
