name: Receipt source format transfer
on:
  pull_request:
    paths:
      - .github/workflows/receipt-format-transfer.yml
permissions:
  contents: read
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/native-receipt-deadlines'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Format the single changed Rust source and store its exact blob
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cargo fmt -p wonderland-web-shell
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          path='apps/web-shell/src/native_lot.rs'
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if changed != [path]:raise SystemExit('Unexpected formatter result: '+str(changed))
          data=pathlib.Path(path).read_bytes()
          if len(data)>100000:raise SystemExit('Unexpected source size')
          body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:blob=json.load(response)
          print('FORMATTED_SOURCE='+json.dumps({'parent':os.environ['SOURCE_HEAD'],'path':path,'blob':blob['sha'],'sha256':hashlib.sha256(data).hexdigest()}))
          subprocess.run(['git','diff','--',path],check=True)
          PY
