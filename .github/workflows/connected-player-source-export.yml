name: Connected player source export
on:
  push:
    branches: [ops/connected-player-source-recovery]
    paths: [.github/workflows/connected-player-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d645334e85e9acf644e7955b13b611cd8d4a9f4
          persist-credentials: false
          show-progress: false
      - name: Export immutable source identity and delta
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 0c9f2c194bd6280d16cf6c4438941c1974da2690
          mkdir -p /tmp/connected-source
          git diff --binary 0c9f2c194bd6280d16cf6c4438941c1974da2690 HEAD > /tmp/connected-source/source.patch
          git ls-tree -rz HEAD > /tmp/connected-source/tree.bin
          git rev-parse HEAD > /tmp/connected-source/revision.txt
          git rev-parse 'HEAD^{tree}' >> /tmp/connected-source/revision.txt
          cd /tmp/connected-source
          sha256sum source.patch tree.bin revision.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: connected-player-source
          path: /tmp/connected-source/
          retention-days: 3
          if-no-files-found: error
