name: Checkpoint tail source transfer
on:
  push:
    branches: [fix/native-checkpoint-pose-tail]
    paths: [tools/native-browser/checkpoint-tail-delivery.json]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate exact bounded patch without executing product code
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          p=pathlib.Path('tools/native-browser/checkpoint-tail-delivery.json')
          assert p.is_file() and p.stat().st_size<100000
          doc=json.loads(p.read_text())
          base='0c9f2c194bd6280d16cf6c4438941c1974da2690'
          assert doc['base']==base and doc['schema']==1
          allowed={'.github/workflows/native-browser.yml','.github/workflows/native-pose-retention.yml','apps/web-shell/examples/native_pose_retention_probe.rs','apps/web-shell/scripts/verify-native-pose-retention.mjs','crates/game-runtime/examples/native_browser_peer.rs','crates/game-runtime/src/live_session.rs','crates/game-runtime/src/live_wire.rs','crates/game-runtime/tests/checkpoint_avatar_recovery.rs','docs/design/action-first/checkpoint-pose-tail-verification.json','docs/design/action-first/checkpoint-pose-tail.md','tools/native-browser/peer.mjs','tools/native-browser/verify-checkpoint-tail.mjs'}
          assert set(doc['paths'])==allowed
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=dec.decompress(base64.b64decode(doc['patch_xz_base64'],validate=True),max_length=500001)
          assert dec.eof and not dec.unused_data and len(patch)<=500000
          assert hashlib.sha256(patch).hexdigest()==doc['sha256']=='12e3cb95ba2e155e9ece75adfaa54f8c78dc545e975016dddd6c7be0bdbec909'
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==doc['tree']=='2774a37886376d25e6d7e0658a83e377face1848'
          files=[]
          for path in sorted(allowed):
              entry=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).strip()
              mode,sha,stage=entry.split('\t')[0].split()
              assert mode=='100644' and stage=='0'
              data=subprocess.check_output(['git','show',':'+path]);assert len(data)<200000
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              files.append({'path':path,'mode':mode,'type':'blob','sha':sha,'content':base64.b64encode(data).decode()})
          pathlib.Path('checkpoint-tail-files.json').write_text(json.dumps({'base':base,'tree':tree,'patch_sha256':doc['sha256'],'files':files}))
          print('Validated exact tested source tree:',tree)
          PY
      - name: Store checked blobs only; no commit or branch movement
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          doc=json.loads(pathlib.Path('checkpoint-tail-files.json').read_text())
          for f in doc['files']:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':f.pop('content')}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:assert json.load(r)['sha']==f['sha']
          doc['branch_updated']=False;doc['tests_executed_by_transfer']=False
          pathlib.Path('checkpoint-tail-tree.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-tail-tree
          path: checkpoint-tail-tree.json
          retention-days: 3
          if-no-files-found: error
