name: Native avatar source transfer
on:
  push:
    branches: [feat/native-avatar-presentation]
    paths: [tools/native-browser/avatar-delivery.json]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate exact source tree without executing application code
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          p=pathlib.Path('tools/native-browser/avatar-delivery.json')
          assert p.is_file() and p.stat().st_size<100000
          doc=json.loads(p.read_text())
          base='0df5bf4c10272e2dc9fee976cf4d2b744e9d7e16'
          assert doc['base']==base and doc['tree']=='ee3cc73a88a3905e644e1abcce29c364cd734a0c'
          allowed={'.github/workflows/native-browser.yml','apps/web-shell/examples/native_avatar_resources.rs','apps/web-shell/src/connected_world.rs','apps/web-shell/src/lib.rs','apps/web-shell/src/native_avatar.rs','apps/web-shell/src/native_lot.rs','apps/web-shell/tests/native_avatar.rs','apps/web-shell/tests/support/native_avatar_bank.rs','crates/game-runtime/examples/native_browser_peer.rs','crates/game-runtime/src/avatar_projection.rs','crates/game-runtime/src/lib.rs','crates/game-runtime/src/live_wire/player.rs','crates/game-runtime/tests/native_player.rs','docs/design/action-first/native-avatar-presentation.md','docs/design/action-first/native-avatar-presentation-verification.json','tools/native-browser/verify-avatars.mjs'}
          assert set(doc['paths'])==allowed
          parts=['tools/native-browser/avatar-part-'+str(i)+'.b64' for i in range(4)]
          assert doc['parts']==parts
          chunks=[]
          for name in parts:
              part=pathlib.Path(name);assert part.is_file() and not part.is_symlink() and part.stat().st_size<=8001
              chunks.append(part.read_text().strip())
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=dec.decompress(base64.b64decode(''.join(chunks),validate=True),max_length=1024*1024+1)
          assert dec.eof and not dec.unused_data and len(patch)<=1024*1024
          assert hashlib.sha256(patch).hexdigest()==doc['sha256']
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==doc['tree']
          files=[]
          for path in sorted(allowed):
              mode,expected,stage=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split('\t')[0].split()
              assert mode=='100644' and stage=='0'
              raw=subprocess.check_output(['git','show',':'+path]);assert len(raw)<300000
              files.append({'path':path,'mode':mode,'sha':expected,'content':base64.b64encode(raw).decode()})
          pathlib.Path('avatar-source-blobs.json').write_text(json.dumps({'base':base,'tree':doc['tree'],'files':files}))
          print('Exact local source tree verified:',doc['tree'])
          PY
      - name: Store checked blobs only without changing branches or commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          doc=json.loads(pathlib.Path('avatar-source-blobs.json').read_text())
          entries=[]
          for f in doc['files']:
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/blobs',data=json.dumps({'content':f['content'],'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:stored=json.load(response)['sha']
              assert stored==f['sha']
              entries.append({'path':f['path'],'mode':f['mode'],'type':'blob','sha':stored})
          doc['files']=entries;doc['branch_updated']=False;doc['tests_executed_by_transfer']=False
          pathlib.Path('native-avatar-tree.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-avatar-tree
          path: native-avatar-tree.json
          retention-days: 3
          if-no-files-found: error
