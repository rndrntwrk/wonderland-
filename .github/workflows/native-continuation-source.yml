name: Native continuation source transfer
on:
  push:
    branches: [feat/native-player-continuation]
    paths: [tools/native-browser/continuation-delivery.json]
permissions:
  contents: read
jobs:
  blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate the exact source delta without executing application code
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          p=pathlib.Path('tools/native-browser/continuation-delivery.json')
          assert p.is_file() and p.stat().st_size<100000
          doc=json.loads(p.read_text())
          assert doc['base']=='ce54857000c253249f0bdd7b880038f9227e6cbc'
          allowed={'apps/web-shell/src/native_lot.rs','crates/game-runtime/src/live_wire/player.rs','crates/game-runtime/src/live_wire/player/activity.rs','crates/game-runtime/tests/native_player.rs','crates/game-runtime/examples/native_browser_peer.rs','tools/native-browser/verify.mjs','docs/design/action-first/native-action-feedback.md','docs/design/action-first/native-action-feedback-verification.json'}
          assert set(doc['paths'])==allowed
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(base64.b64decode(doc['patch'],validate=True),max_length=1024*1024+1)
          assert decoder.eof and not decoder.unused_data and len(patch)<=1024*1024
          assert hashlib.sha256(patch).hexdigest()==doc['sha256']
          subprocess.run(['git','fetch','--depth=1','origin',doc['base']],check=True)
          subprocess.run(['git','checkout','--detach',doc['base']],check=True)
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==doc['tree'],(tree,doc['tree'])
          files=[]
          for path in sorted(allowed):
              item=pathlib.Path(path);assert item.is_file() and not item.is_symlink()
              data=item.read_bytes();assert len(data)<=100000 and b'\0' not in data
              data.decode('utf-8')
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              files.append({'path':path,'sha':sha,'content':base64.b64encode(data).decode()})
          pathlib.Path('/tmp/native-verified-files.json').write_text(json.dumps({'base':doc['base'],'tree':tree,'files':files}))
          print('Exact source tree:',tree)
          PY
      - name: Store checked code blobs only; do not move a branch or create a commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          doc=json.loads(pathlib.Path('/tmp/native-verified-files.json').read_text())
          entries=[]
          for f in doc['files']:
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/blobs',data=json.dumps({'content':f['content'],'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:sha=json.load(response)['sha']
              assert sha==f['sha']
              entries.append({'path':f['path'],'mode':'100644','type':'blob','sha':sha})
          doc['files']=entries;doc['branch_updated']=False;doc['tests_executed_by_transfer']=False
          pathlib.Path('native-activity-tree.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-activity-tree
          path: native-activity-tree.json
          retention-days: 3
          if-no-files-found: error
