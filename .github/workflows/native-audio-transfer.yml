name: Native audio source transfer
on:
  push:
    branches: [feat/native-gameplay-audio]
    paths: [tools/native-browser/audio-delivery.json]
permissions:
  contents: read
jobs:
  blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate exact bounded source delta without executing it
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          p=pathlib.Path('tools/native-browser/audio-delivery.json')
          assert p.is_file() and p.stat().st_size<100000
          doc=json.loads(p.read_text())
          base='8d0f78c60a885c6968abe349afd8c89ef890c8f8'
          assert doc['base']==base and doc['schema']==1
          allowed={'.github/workflows/native-browser.yml','apps/web-shell/index.html','apps/web-shell/public/audio/source-audio.mjs','apps/web-shell/public/native-audio.mjs','apps/web-shell/scripts/native-audio.test.mjs','apps/web-shell/src/avatar_content.rs','apps/web-shell/src/lib.rs','apps/web-shell/src/native_audio.rs','apps/web-shell/src/native_audio_browser.rs','apps/web-shell/src/native_lot.rs','apps/web-shell/tests/native_audio.rs','crates/audio-content/src/lib.rs','crates/audio-content/src/pack.rs','crates/audio-content/tests/pack.rs','crates/audio-runtime/browser/source-audio.mjs','crates/game-runtime/examples/native_browser_peer.rs','crates/world-view/src/scene.rs','docs/design/action-first/native-gameplay-audio-verification.json','docs/design/action-first/native-gameplay-audio.md','tools/native-browser/audio-fixture.mjs','tools/native-browser/verify-audio.mjs'}
          assert set(doc['paths'])==allowed
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=dec.decompress(base64.b64decode(doc['patch_xz_base64'],validate=True),max_length=500001)
          assert dec.eof and not dec.unused_data and len(patch)<=500000
          assert hashlib.sha256(patch).hexdigest()==doc['sha256']=='3c45efa89fdd054e9652fb19ea8090a676a38acd07d2f93e32660889d8ae6261'
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          subprocess.run(['git','checkout','--detach',base],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='4aef37efa737fe340afaf4f1a3ab5f747bf36513'
          subprocess.run(['git','apply','--unidiff-zero','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','-'],input=patch,check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==doc['tree']=='dd4aeee0124b7ff0451cfb7ac0bdfc9f35f66785'
          files=[]
          for path in sorted(allowed):
              entry=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).strip()
              mode,sha,stage=entry.split('\t')[0].split()
              assert mode=='100644' and stage=='0'
              data=subprocess.check_output(['git','show',':'+path]);assert len(data)<200000
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              files.append({'path':path,'mode':mode,'type':'blob','sha':sha,'content':base64.b64encode(data).decode()})
          pathlib.Path('native-audio-files.json').write_text(json.dumps({'base':base,'tree':tree,'patch_sha256':doc['sha256'],'files':files}))
          print('Exact locally tested tree:',tree)
          PY
      - name: Store checked blobs only; do not create a commit or update branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          doc=json.loads(pathlib.Path('native-audio-files.json').read_text())
          for f in doc['files']:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':f.pop('content')}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:assert json.load(r)['sha']==f['sha']
          doc['branch_updated']=False
          doc['tests_executed_by_transfer']=False
          pathlib.Path('native-audio-tree.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-audio-tree
          path: native-audio-tree.json
          retention-days: 3
          if-no-files-found: error
