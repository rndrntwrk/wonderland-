name: Swarm C guarded lighting publication
on:
  push:
    branches: [work/swarm-c-client-recovery]
    paths: [.github/workflows/swarm-c-lighting-publish.yml]
permissions:
  contents: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore only the exact reviewed lighting patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = rndrntwrk/wonderland-
          test "$GITHUB_REF" = refs/heads/work/swarm-c-client-recovery
          mkdir -p /tmp/lighting-evidence
          python3 - <<'PY'
          import subprocess,json,base64,gzip,hashlib
          from pathlib import Path
          blobs=['5d6b94970e4bdd6b837becf745ef6266aa564b3c','97c84656584ce7ada7ea5b8d698bf6eb9f20fb9f','0dbd94b58d164566a80734cf8ef8434002b1bfc6','d48f280685dae48827326b1a06bfcb03ad8c4a0d','eac7f4578091b6067d414c2462f8fca06dfa4dc4']
          chunks=[]
          for sha in blobs:
              obj=json.loads(subprocess.check_output(['gh','api',f'repos/rndrntwrk/wonderland-/git/blobs/{sha}']))
              assert obj['encoding']=='base64'
              data=base64.b64decode(obj['content'])
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==sha
              chunks.append(data)
          compressed=b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest()=='9c3bf3b26a2c9f4bbf123ba0c056d14fe16f55d205ca1af7e59b650d1099eb69'
          patch=gzip.decompress(compressed)
          assert len(patch)==70685
          assert hashlib.sha256(patch).hexdigest()=='4eaad83d9669396a6d4bfb452a677eba1800c2b35108bd3810666b4b81a21167'
          allowed=['Cargo.lock','Cargo.toml','apps/web-shell/public/world-gpu.mjs','apps/web-shell/src/snapshot_world.rs','apps/web-shell/tests/gpu/application.mjs','apps/web-shell/tests/gpu/lighting.test.mjs','crates/render-core/src/reference.rs','crates/render-core/src/reference/lightmap.rs','crates/render-core/tests/lightmap_safe.rs','crates/world-view/Cargo.toml','crates/world-view/examples/gpu_fixture.rs','crates/world-view/examples/support/lighting.rs','crates/world-view/src/blueprint.rs','crates/world-view/src/document.rs','crates/world-view/src/lib.rs','crates/world-view/src/lighting.rs','crates/world-view/src/renderer.rs','crates/world-view/src/renderer/gpu.rs','crates/world-view/tests/lighting_admission.rs','crates/world-view/tests/lighting_client.rs','crates/world-view/tests/support/lighting.rs','docs/swarm-c/RECOVERY_LEDGER.md']
          target=Path('/tmp/lighting-evidence/implementation.patch');target.write_bytes(patch)
          names=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
          assert {line.split('\t',2)[2] for line in names.splitlines()}==set(allowed)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--whitespace=error',str(target)],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD:crates/render-iso'],text=True).strip()=='0aa3a578724b6308f4b748af2485a568ed28e8df'
          manifest={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in allowed}
          Path('/tmp/lighting-evidence/source-sha256.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Verify native, WASM and existing source GPU protocols
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo +1.99.0 fmt --all -- --check 2>&1 | tee /tmp/lighting-evidence/format.log
          cargo +1.99.0 test -p wonderland-world-view -p wonderland-render-core -p wonderland-render-iso -p wonderland-render-3d --locked 2>&1 | tee /tmp/lighting-evidence/native-tests.log
          cargo +1.99.0 clippy -p wonderland-render-core -p wonderland-world-view --all-targets --locked -- -D warnings 2>&1 | tee /tmp/lighting-evidence/native-clippy.log
          cargo +1.99.0 clippy -p wonderland-web-shell --target wasm32-unknown-unknown --lib --bin wonderland-web-shell --locked -- -D warnings 2>&1 | tee /tmp/lighting-evidence/wasm-clippy.log
          node --test apps/web-shell/tests/gpu/*.test.mjs | tee /tmp/lighting-evidence/node-tests.log
          cargo +1.99.0 run -p wonderland-world-view --example gpu_fixture --locked -- tests/output/source-gpu
          node --check apps/web-shell/tests/gpu/application.mjs
          git diff --check
      - name: Publish only checked source without force or workflow changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,hashlib
          from pathlib import Path
          manifest=json.loads(Path('/tmp/lighting-evidence/source-sha256.json').read_text())
          for path,digest in manifest.items(): assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          subprocess.run(['git','add','--intent-to-add','--',*manifest],check=True)
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(manifest)
          subprocess.run(['git','add','--',*manifest],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(manifest)
          PY
          git diff --cached --check
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          REMOTE="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" ls-remote origin refs/heads/work/swarm-c-client-recovery | cut -f1)"
          test "$REMOTE" = "$GITHUB_SHA"
          git config user.name 'Wonderland verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(swarm-c): restore validated source lighting and safe CPU/GPU sampling'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/work/swarm-c-client-recovery
          git rev-parse HEAD > /tmp/lighting-evidence/tested-commit.txt
          git rev-parse HEAD^{tree} > /tmp/lighting-evidence/tested-tree.txt
          git archive --format=tar.gz HEAD -- .github Cargo.toml Cargo.lock rust-toolchain.toml apps crates docs fixtures tests tools services > /tmp/lighting-evidence/source-input.tar.gz
          sha256sum /tmp/lighting-evidence/source-input.tar.gz > /tmp/lighting-evidence/archive.sha256
          git diff --exit-code
      - name: Preserve exact source and verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lighting-publication-${{ github.sha }}
          path: /tmp/lighting-evidence/
          if-no-files-found: error
          retention-days: 14
