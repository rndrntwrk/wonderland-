name: Native browser local tools
on:
  push:
    branches: [fix/native-browser-action-admission]
    paths: [.github/workflows/native-browser-local-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve Trunk 0.21.14 default optimizer
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-optimizer
          cd /tmp/native-optimizer
          curl --fail --location --retry 2 -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          tar -xzf binaryen.tar.gz --strip-components=1
          bin/wasm-opt --version > versions.txt
          sha256sum binaryen.tar.gz bin/wasm-opt > SHA256SUMS
          tar -czf /tmp/native-optimizer.tar.gz bin/wasm-opt versions.txt SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: native-browser-optimizer
          path: /tmp/native-optimizer.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
