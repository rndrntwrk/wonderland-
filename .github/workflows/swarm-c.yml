name: Swarm C presentation

on:
  push:
    branches: [feat/swarm-c-views-audio]
    paths:
      - 'crates/render-core/**'
      - 'crates/render-iso/**'
      - 'crates/render-3d/**'
      - 'crates/avatar-view/**'
      - 'crates/audio-runtime/**'
      - 'probes/engine-bakeoff/**'
      - 'tools/swarm-c/**'
      - '.github/workflows/swarm-c.yml'
  pull_request:
    paths:
      - 'crates/render-core/**'
      - 'crates/render-iso/**'
      - 'crates/render-3d/**'
      - 'crates/avatar-view/**'
      - 'crates/audio-runtime/**'
      - 'probes/engine-bakeoff/**'
      - 'tools/swarm-c/**'
      - '.github/workflows/swarm-c.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/swarm-c-views-audio'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the isolated reference compiler
        run: |
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.75.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install original-source and native audio tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mono-mcs mono-runtime ffmpeg
      - name: Verify presentation libraries
        run: bash tools/swarm-c/verify.sh
      - name: Compare actual native and ordinary WASM execution
        if: always()
        run: bash tools/swarm-c/verify-native-wasm.sh
      - name: Compare codecs with original source and exercise native audio
        if: always()
        run: bash tools/swarm-c/verify-audio.sh
      - name: Check out the pinned A provider for the authority boundary probe
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rndrntwrk/wonderland-
          ref: 8a0e251d19e222a0a6833d7408ca629f674e1729
          path: swarm-a-input
          persist-credentials: false
      - name: Verify presentation cannot alter A simulation or duplicate cues
        if: always()
        env:
          RUSTUP_TOOLCHAIN: '1.75.0'
          SWARM_A_PATH: ${{ github.workspace }}/swarm-a-input
        run: |
          cargo fetch --locked --manifest-path swarm-a-input/crates/sim-core/Cargo.toml
          python3 tools/swarm-c/avatar-integration/run.py tools/swarm-c/output/avatar-a 2>&1 | tee tools/swarm-c/output/avatar-a.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swarm-c-reference-${{ github.sha }}
          path: tools/swarm-c/output/
          retention-days: 14
          if-no-files-found: warn

  engine:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/swarm-c-views-audio'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: bevy, backend: native }
          - { engine: bevy, backend: webgpu }
          - { engine: bevy, backend: webgl2 }
          - { engine: fyrox, backend: native }
          - { engine: fyrox, backend: webgl2 }
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/engine-target
      WONDERLAND_ENGINE: ${{ matrix.engine }}
      WONDERLAND_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the isolated engine compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
      - name: Provision native and software graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb
      - name: Build the actual engine and preserve its resolution
        run: bash tools/swarm-c/build-engine.sh
      - name: Exercise the native software renderer
        if: matrix.backend == 'native'
        run: bash tools/swarm-c/run-native-engine.sh
      - name: Exercise the browser software renderer
        if: matrix.backend != 'native'
        run: bash tools/swarm-c/run-browser-engine.sh
      - name: Print bounded runtime diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          for path in (pathlib.Path('probes/engine-bakeoff') / os.environ['WONDERLAND_ENGINE'] / 'Cargo.lock', pathlib.Path('tools/swarm-c/package-lock.json')):
              if path.is_file():
                  data = base64.b64encode(path.read_bytes()).decode('ascii')
                  print('WONDERLAND_FILE_BEGIN ' + str(path))
                  for offset in range(0, len(data), 12000):
                      print('WONDERLAND_FILE_DATA ' + data[offset:offset + 12000])
                  print('WONDERLAND_FILE_END ' + str(path))
          for path in sorted(pathlib.Path('tools/swarm-c/output').rglob('*')):
              if path.is_file() and path.name in ('report.json', 'console.json', 'native-report.json', 'native.log'):
                  print('DIAGNOSTIC_FILE', path)
                  print(path.read_text(errors='replace')[-60000:])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swarm-c-${{ matrix.engine }}-${{ matrix.backend }}-${{ github.sha }}
          path: |
            tools/swarm-c/output/
            probes/engine-bakeoff/${{ matrix.engine }}/Cargo.lock
            probes/engine-bakeoff/web/pkg/
          retention-days: 14
          if-no-files-found: warn
