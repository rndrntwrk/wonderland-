name: Read native browser evidence
on:
  pull_request:
    paths:
      - .github/workflows/native-browser-evidence-read.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-browser-evidence
          run-id: 37547666393
          github-token: ${{ github.token }}
          path: evidence
      - name: Read browser failure details and real test counts
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('evidence')
          for name in ['results.json','native-player.log','socket.log','gateway.log']:
              p=root/name
              print('\n=== '+name+' ===')
              if p.exists():print(p.read_text()[:24000])
          p=root/'workspace.log'
          if p.exists():
              items=re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;',p.read_text())
              print('WORKSPACE:',{'passed':sum(int(r[0]) for r in items),'failed':sum(int(r[1]) for r in items),'ignored':sum(int(r[2]) for r in items)})
          PY
