name: Browser UI

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - apps/web-shell/**
      - services/browser-gateway/**
      - tools/**
      - tests/**
      - fixtures/**
      - .github/workflows/browser-ui.yml
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - apps/web-shell/**
      - services/browser-gateway/**
      - tools/**
      - tests/**
      - fixtures/**
      - .github/workflows/browser-ui.yml

permissions:
  contents: read

jobs:
  rust-browser-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Native runtime, content, protocol, renderer, gateway and UI tests
        run: cargo test --workspace --locked
      - name: Browser audio bridge tests
        run: node --test crates/audio-runtime/browser/*.test.mjs
      - name: Source GPU and PNG capture regression tests
        run: node --test apps/web-shell/tests/gpu/*.test.mjs
      - name: Native clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Browser clippy
        run: cargo clippy -p wonderland-web-shell --target wasm32-unknown-unknown --lib --bin wonderland-web-shell --locked -- -D warnings
      - name: Install pinned Trunk
        run: cargo install trunk --version 0.21.14 --locked
      - name: Build the actual WASM application
        working-directory: apps/web-shell
        run: trunk build --release --locked
      - name: Exercise the built source-world application and actual GPU recovery
        run: |
          set -euo pipefail
          node --check apps/web-shell/tests/gpu/application.mjs
          npm install --prefix /tmp/source-app-playwright --ignore-scripts --no-audit --no-fund playwright@1.62.1
          /tmp/source-app-playwright/node_modules/.bin/playwright install --with-deps --no-shell chromium
          WONDERLAND_PLAYWRIGHT_MODULE=/tmp/source-app-playwright/node_modules/playwright/index.mjs node apps/web-shell/tests/gpu/application.mjs
      - name: Preserve exact application observations, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-application-${{ github.sha }}
          path: tests/output/source-application/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the verified browser preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: wonderland-browser-preview
          path: apps/web-shell/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Report required formatting and dependency-lock changes
        if: failure()
        run: |
          cargo fmt --all || true
          cargo metadata --format-version 1 > /dev/null || true
          git diff -- Cargo.lock crates apps/web-shell
