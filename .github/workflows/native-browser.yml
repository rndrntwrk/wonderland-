name: Native browser
on:
  pull_request:
    paths:
      - apps/web-shell/**
      - crates/**
      - services/browser-gateway/**
      - .github/workflows/native-browser.yml
      - tools/native-browser/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
permissions:
  contents: read
concurrency:
  group: native-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Verify tracked source without generating call sites
        run: |
          mkdir -p /tmp/wonderland-native-browser-evidence
          cargo fmt --all -- --check
          cargo test --workspace --locked > /tmp/wonderland-native-browser-evidence/workspace.log 2>&1 || { tail -100 /tmp/wonderland-native-browser-evidence/workspace.log; exit 1; }
          node --test --test-reporter=tap apps/web-shell/scripts/native-*.test.mjs > /tmp/wonderland-native-browser-evidence/socket.log 2>&1
          node --test --test-reporter=tap crates/audio-runtime/browser/*.test.mjs > /tmp/wonderland-native-browser-evidence/audio.log 2>&1
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p wonderland-web-shell --target wasm32-unknown-unknown --lib --bin wonderland-web-shell --locked -- -D warnings
      - name: Build actual browser and controlled authority
        run: |
          cargo install trunk --version 0.21.14 --locked --quiet
          (cd apps/web-shell && trunk build --release --locked)
          cmp apps/web-shell/public/native-socket.mjs apps/web-shell/dist/native-socket.mjs
          cargo build -q -p wonderland-browser-gateway --example controlled_replay --locked
          cargo build -q -p wonderland-game-runtime --example native_browser_peer --locked
      - name: Execute the browser action, latency and reconnect journey
        run: |
          npm --prefix tools/native-browser ci --ignore-scripts --no-audit --no-fund
          tools/native-browser/node_modules/.bin/playwright install --with-deps chromium
          timeout 240s node tools/native-browser/verify.mjs > /tmp/wonderland-native-browser-evidence/browser.log 2>&1 || { cat /tmp/wonderland-native-browser-evidence/browser.log; exit 1; }
      - name: Verify native avatar resources in the actual browser
        run: |
          cargo run -q -p wonderland-web-shell --example native_avatar_resources --locked -- target/native-avatar-fixtures
          mkdir -p /tmp/wonderland-native-browser-evidence/avatars
          WONDERLAND_NATIVE_QA_OUTPUT=/tmp/wonderland-native-browser-evidence/avatars timeout 120s node tools/native-browser/verify-avatars.mjs > /tmp/wonderland-native-browser-evidence/avatars/browser.log 2>&1 || { cat /tmp/wonderland-native-browser-evidence/avatars/browser.log; exit 1; }
      - name: Verify elevated native contact and hidden-avatar rendering
        run: |
          mkdir -p /tmp/wonderland-native-browser-evidence/terrain
          WONDERLAND_NATIVE_TERRAIN_FIXTURE=1 WONDERLAND_NATIVE_QA_OUTPUT=/tmp/wonderland-native-browser-evidence/terrain timeout 120s node tools/native-browser/verify-avatars.mjs > /tmp/wonderland-native-browser-evidence/terrain/browser.log 2>&1 || { cat /tmp/wonderland-native-browser-evidence/terrain/browser.log; exit 1; }
      - name: Verify receipt deadlines and cleanup with actual browser timers
        run: |
          set -o pipefail
          timeout 150s node tools/native-browser/verify-receipt-deadline.mjs 2>&1 | tee /tmp/wonderland-native-browser-evidence/receipt-deadline.log
      - name: Verify source identity after testing
        if: always()
        run: |
          mkdir -p /tmp/wonderland-native-browser-evidence
          git rev-parse HEAD > /tmp/wonderland-native-browser-evidence/revision.txt
          git rev-parse 'HEAD^{tree}' >> /tmp/wonderland-native-browser-evidence/revision.txt
          rustc -vV >> /tmp/wonderland-native-browser-evidence/revision.txt
          node --version >> /tmp/wonderland-native-browser-evidence/revision.txt
          python3 - <<'PYREPORT'
          import hashlib,json,pathlib,re,subprocess
          out=pathlib.Path('/tmp/wonderland-native-browser-evidence')
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          log=(out/'workspace.log').read_text() if (out/'workspace.log').exists() else ''
          counts=re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;',log)
          files=['apps/web-shell/src/native_lot.rs','apps/web-shell/src/native_avatar.rs','apps/web-shell/public/native-socket.mjs','tools/native-browser/verify-avatars.mjs','tools/native-browser/verify-receipt-deadline.mjs','tools/native-browser/peer.mjs','Cargo.lock']
          report={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'native_summaries':{'passed':sum(int(r[0]) for r in counts),'failed':sum(int(r[1]) for r in counts),'ignored':sum(int(r[2]) for r in counts)},'source_sha256':{p:digest(pathlib.Path(p)) for p in files},'wasm_sha256':{p.name:digest(p) for p in pathlib.Path('apps/web-shell/dist').glob('*.wasm')}}
          report['browser']={}
          for name in ['results.json','avatars/report.json','terrain/report.json','receipt-deadline/results.json']:
              path=out/name
              if path.exists():
                  result=json.loads(path.read_text());report['browser'][name]={'passed':result.get('passed'),'checks':len(result.get('checks',[])),'errors':result.get('errors',[]),'screenshots':len(result.get('screenshots',[]))}
          report['evidence_sha256']={str(p.relative_to(out)):digest(p) for p in out.rglob('*') if p.is_file() and p.name!='verification-summary.json'}
          (out/'verification-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print('VERIFICATION_SUMMARY='+json.dumps(report))
          PYREPORT
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-evidence
          path: /tmp/wonderland-native-browser-evidence/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-browser-preview
          path: apps/web-shell/dist/
          if-no-files-found: error
          retention-days: 7
