name: Native browser
on:
  pull_request:
    paths:
      - apps/web-shell/**
      - crates/game-runtime/**
      - crates/sim-core/**
      - .github/workflows/native-browser.yml
      - tools/native-browser/**
      - Cargo.lock
permissions:
  contents: read
concurrency:
  group: native-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Verify tracked source without generating call sites
        run: |
          mkdir -p /tmp/wonderland-native-browser-evidence
          cargo fmt --all -- --check
          cargo test --workspace --locked > /tmp/wonderland-native-browser-evidence/workspace.log 2>&1 || { tail -100 /tmp/wonderland-native-browser-evidence/workspace.log; exit 1; }
          node --test apps/web-shell/scripts/native-socket.test.mjs > /tmp/wonderland-native-browser-evidence/socket.log 2>&1
          node --test crates/audio-runtime/browser/*.test.mjs > /tmp/wonderland-native-browser-evidence/audio.log 2>&1
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p wonderland-web-shell --target wasm32-unknown-unknown --lib --bin wonderland-web-shell --locked -- -D warnings
      - name: Build actual browser and controlled authority
        run: |
          cargo install trunk --version 0.21.14 --locked --quiet
          (cd apps/web-shell && trunk build --release --locked)
          cargo build -q -p wonderland-browser-gateway --example controlled_replay --locked
          cargo build -q -p wonderland-game-runtime --example native_browser_peer --locked
      - name: Execute the browser action, latency and reconnect journey
        run: |
          npm --prefix tools/native-browser ci --ignore-scripts --no-audit --no-fund
          tools/native-browser/node_modules/.bin/playwright install --with-deps chromium
          timeout 240s node tools/native-browser/verify.mjs > /tmp/wonderland-native-browser-evidence/browser.log 2>&1 || { cat /tmp/wonderland-native-browser-evidence/browser.log; exit 1; }
      - name: Verify source identity after testing
        if: always()
        run: |
          git rev-parse HEAD > /tmp/wonderland-native-browser-evidence/revision.txt
          git rev-parse 'HEAD^{tree}' >> /tmp/wonderland-native-browser-evidence/revision.txt
          rustc -vV >> /tmp/wonderland-native-browser-evidence/revision.txt
          node --version >> /tmp/wonderland-native-browser-evidence/revision.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-evidence
          path: /tmp/wonderland-native-browser-evidence/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-browser-preview
          path: apps/web-shell/dist/
          if-no-files-found: error
          retention-days: 7
