[package]
name = "wonderland-audio-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"

[workspace]

[dependencies]
wonderland-render-core = { path = "../render-core" }
serde = { version = "1.0.195", features = ["derive"] }
sha2 = "0.10.8"

[dev-dependencies]
bincode = "1.3.3"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[[bin]]
name = "audio-decode"
path = "src/decoder_cli.rs"
