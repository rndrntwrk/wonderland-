[package]
name = "sim-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
description = "Deterministic, presentation-independent Wonderland simulation"

[lib]
name = "sim_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.195", features = ["derive"] }
bincode = "=1.3.3"
sha2 = "=0.10.8"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
