[package]
name = "wonderland-legacy-formats"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Bounded readers for source-derived FreeSO legacy formats"
license = "MPL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
quick-xml = "0.38"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = { version = "1.5.2", default-features = false }
png = "0.18.1"
