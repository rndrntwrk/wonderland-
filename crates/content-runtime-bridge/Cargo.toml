[package]
name = "wonderland-content-runtime-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MPL-2.0"
description = "Validated content import and isolated debugging against the real Wonderland runtime"

[dependencies]
# Swarm F composes the sibling crate. Before that merge, the reproduction runner
# exports exactly SIM_CORE_REVISION into a scratch assembly without submodules.
sim-core = { path = "../sim-core" }
wonderland-content-ir = { path = "../content-ir" }
wonderland-legacy-formats = { path = "../legacy-formats" }
wonderland-creator = { path = "../../tools/creator", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bincode = "=1.3.3"

[dev-dependencies]
wonderland-asset-cooker = { path = "../../tools/asset-cooker" }

[features]
default = ["creator-debug"]
creator-debug = ["dep:wonderland-creator"]

[[bin]]
name = "runtime-bridge"
path = "src/main.rs"

[[test]]
name = "source_runtime"
path = "../../tests/integration/swarm_b_runtime/source_runtime.rs"

[[test]]
name = "content_import"
path = "../../tests/integration/swarm_b_runtime/content_import.rs"

[[test]]
name = "query_bounds"
path = "../../tests/integration/swarm_b_runtime/query_bounds.rs"

[[test]]
name = "watch_output"
path = "../../tests/integration/swarm_b_runtime/watch_output.rs"
required-features = ["creator-debug"]

[[test]]
name = "cooked_release"
path = "../../tests/integration/swarm_b_runtime/cooked_release.rs"

[[test]]
name = "cooked_rejection"
path = "../../tests/integration/swarm_b_runtime/cooked_rejection.rs"

[[test]]
name = "cooked_metadata"
path = "../../tests/integration/swarm_b_runtime/cooked_metadata.rs"

[[test]]
name = "cooked_cli"
path = "../../tests/integration/swarm_b_runtime/cooked_cli.rs"

[[test]]
name = "cooked_scopes"
path = "../../tests/integration/swarm_b_runtime/cooked_scopes.rs"

[[example]]
name = "cooked-fixture"
path = "../../tests/integration/swarm_b_runtime/cooked_fixture_export.rs"

[[example]]
name = "source-replay"
path = "../../tests/integration/swarm_b_runtime/source_replay.rs"
