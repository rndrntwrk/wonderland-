[package]
name = "wonderland-content-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Deterministic FreeSO content resolution and provenance"
license = "MPL-2.0"

[dependencies]
wonderland-legacy-formats = { path = "../legacy-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "content-census"
path = "../../tools/swarm-b/content-census.rs"
