[package]
name = "wonderland-presentation-replay"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wonderland-engine-fixture = { path = "../fixture" }
wonderland-render-core = { path = "../../../crates/render-core" }
sha2 = "0.10"

[profile.release]
overflow-checks = true
opt-level = 2
