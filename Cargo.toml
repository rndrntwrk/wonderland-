[workspace]
members = ["crates/contracts", "crates/client-app", "apps/web-shell"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wonderland-contracts = { path = "crates/contracts" }
wonderland-client-app = { path = "crates/client-app" }
