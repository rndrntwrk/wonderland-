[package]
name = "wonderland-web-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wonderland-contracts.workspace = true
wonderland-client-app.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlDialogElement", "DomRect", "Location", "UrlSearchParams", "PointerEvent", "KeyboardEvent", "WheelEvent", "MediaQueryList", "Storage"] }
console_error_panic_hook = "0.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wonderland-web-shell"
path = "src/main.rs"
